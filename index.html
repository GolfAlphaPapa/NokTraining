<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NOK AIR CBTA Mini Briefings</title>
<meta name="description" content="CBTA mini briefings for B737 simulator training, Nok Air.">
<style>
  :root{
    --yellow:#ffc700; --navy:#0b1f3a; --ink:#14213a; --muted:#5b6678;
    --bg:#f5f6f9; --card:#ffffff; --line:#e1e5ec;
  }
  @media (prefers-color-scheme: dark){
    :root{ --ink:#e8ecf4; --muted:#9aa5b8; --bg:#0c1524; --card:#13203a; --line:#24334f; }
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);line-height:1.5}
  header{background:var(--navy);color:#fff;border-bottom:6px solid var(--yellow)}
  .wrap{max-width:1040px;margin:0 auto;padding:0 16px}
  .hero{display:flex;align-items:center;gap:20px;padding:28px 0}
  .logo{height:64px;width:auto;max-width:180px;object-fit:contain}
  .logo-fallback{display:none;background:var(--yellow);color:var(--navy);font-weight:900;letter-spacing:.08em;padding:14px 18px;border-radius:10px;font-size:20px}
  h1{margin:0;font-size:clamp(22px,4vw,34px);line-height:1.15}
  .sub{margin:6px 0 0;color:#c7d2e6;font-size:15px}
  .tools{padding:18px 0 4px}
  input[type=search]{width:100%;padding:12px 14px;font-size:16px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink)}
  input[type=search]:focus{outline:2px solid var(--yellow);outline-offset:1px}
  h2{font-size:18px;margin:28px 0 10px;padding-left:10px;border-left:5px solid var(--yellow)}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
  a.card{display:block;text-decoration:none;color:inherit;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;transition:transform .12s,border-color .12s}
  a.card:hover,a.card:focus-visible{transform:translateY(-2px);border-color:var(--yellow);outline:none}
  .card b{display:block;font-size:16px}
  .card span{display:block;color:var(--muted);font-size:13.5px;margin-top:4px}
  .empty{display:none;color:var(--muted);padding:24px 0}
  footer{margin:40px 0 28px;color:var(--muted);font-size:12.5px;text-align:center}
</style>
</head>
<body>
<header>
  <div class="wrap hero">
    <img class="logo" src="logo.png" alt="Nok Air" onerror="this.style.display='none';this.nextElementSibling.style.display='block'">
    <div class="logo-fallback">NOK AIR</div>
    <div>
      <h1>CBTA Mini Briefings</h1>
      <p class="sub">B737 simulator training &middot; Nok Air</p>
    </div>
  </div>
</header>

<main class="wrap">
  <div class="tools">
    <input id="q" type="search" placeholder="Search mini briefings..." aria-label="Search mini briefings">
  </div>
  <div id="list"></div>
  <p class="empty" id="empty">No mini briefing matches your search.</p>
</main>

<footer>Prepared by Capt. Supakit Punyangam &middot; Nok Air Training</footer>

<script>
/* EDIT HERE: add or change entries. Each "url" points to a file in the briefings folder. */
const GROUPS = [
  { name: "Foundations", items: [
    { title: "CBTA", desc: "CBTA · training philosophy · threat and error management · the unexpected", url: "MiniBriefing_CBTA_Training_Philosophy/CBTA_Mini_Briefing_CBTA_Training_Philosophy.html" },
  ]},
  { name: "Flight Path and Maneuvers", items: [
    { title: "Steep Turn", desc: "Manual flight path control", url: "MiniBriefing_Steep%20Turn/CBTA_Mini_Briefing_Template_SteepTurn.html" },
    { title: "Stall Recovery", desc: "Recognition and recovery", url: "MiniBriefing_StallRecovery/CBTA_Mini_Briefing_StallRecovery.html" },
    { title: "UPRT", desc: "Upset prevention and recovery training", url: "MiniBriefing_UPRT/CBTA_Mini_Briefing_UPRT.html" },
    { title: "Crosswind Takeoff and Landing", desc: "Technique and limits", url: "MiniBriefing_CrosswindTakeoffLanding/CBTA_Mini_Briefing_CrosswindTakeoffLanding.html" },
    { title: "Visual Approach", desc: "Stabilised visual approach", url: "MiniBriefing_VisualApproach/CBTA_Mini_Briefing_VisualApproach.html" },
    { title: "Circling Approach", desc: "Planning and flying the circle", url: "MiniBriefing_Circling/CBTA_Mini_Briefing_CirclingApproach.html" },
  ]},
  { name: "FDAP Program", items: [
    { title: "ILS Pitch Swing", desc: "Pitch control on the ILS", url: "MiniBriefing_FADP/CBTA_Mini_Briefing_ILS_PitchSwing.html" },
    { title: "Long Landing Prevention", desc: "Touchdown point and flare", url: "MiniBriefing_FADP/CBTA_Mini_Briefing_LongLanding.html" },
  ]},
  { name: "Abnormal and Emergency", items: [
    { title: "Rejected Takeoff", desc: "Decision and actions", url: "MiniBriefing_RTO/CBTA_Mini_Briefing_RejectedTakeoff.html" },
    { title: "Engine Out (OEI)", desc: "One engine inoperative handling", url: "MiniBriefing_EngineOut_OEI/CBTA_Mini_Briefing_EngineOut_OEI.html" },
    { title: "Flap Malfunctions", desc: "Non-normal flap operations", url: "MiniBriefing_FlapMalfunction/CBTA_Mini_Briefing_FlapMalfunction.html" },
    { title: "Loss of Both Generators", desc: "Electrical failure management", url: "MiniBriefing_LossOfBothGenerators/CBTA_Mini_Briefing_LossOfBothGenerators.html" },
    { title: "Emergency Descent", desc: "Rapid descent actions", url: "MiniBriefing_Emergency%20Descent/CBTA_Mini_Briefing_EmergencyDescent.html" },
    { title: "TCAS Event", desc: "TA and RA response", url: "MiniBriefing_TCAS/CBTA_Mini_Briefing_TCAS.html" },
  ]},
  { name: "Weather and Operations", items: [
    { title: "Windshear", desc: "Avoidance, decision and recovery", url: "MiniBriefing_Windshear/CBTA_Mini_Briefing_Windshear.html" },
    { title: "All Weather Operations", desc: "Operating in adverse conditions", url: "MiniBriefing_All_Weather_Operation/CBTA_Mini_Briefing_AllWeatherOps.html" },
  ]},
];

const list = document.getElementById('list');
const empty = document.getElementById('empty');
const esc = s => s.replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function render(filter = '') {
  const f = filter.trim().toLowerCase();
  let html = '', shown = 0;
  for (const g of GROUPS) {
    const items = g.items.filter(i => !f || (i.title + ' ' + i.desc + ' ' + g.name).toLowerCase().includes(f));
    if (!items.length) continue;
    shown += items.length;
    html += `<h2>${esc(g.name)}</h2><div class="grid">` +
      items.map(i => `<a class="card" href="${esc(i.url)}"><b>${esc(i.title)}</b><span>${esc(i.desc)}</span></a>`).join('') +
      `</div>`;
  }
  list.innerHTML = html;
  empty.style.display = shown ? 'none' : 'block';
}
document.getElementById('q').addEventListener('input', e => render(e.target.value));
render();
</script>
</body>
</html>
